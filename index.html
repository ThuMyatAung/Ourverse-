<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System & Asteroids</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #info {
            position: absolute; top: 15px; left: 15px; color: #fff;
            background: rgba(0,0,0,0.6); padding: 12px 18px; border-radius: 8px;
            font-size: 14px; pointer-events: none; border: 1px solid #333;
        }
    </style>
    <!-- Three.js & OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">
        <h3 style="margin:0 0 5px 0;">Solar System & Asteroid Belt</h3>
        <p style="margin:0; opacity:0.8;">Mouse ဖြင့် ဆွဲလှည့်ပြီး Scroll ဖြင့် Zoom ဆွဲကြည့်နိုင်ပါသည်။</p>
    </div>

    <script>
        // ၁။ Scene, Camera, Renderer တည်ဆောက်ခြင်း
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(0, 150, 250);
        controls.update();

        // အလင်းရောင်
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);
        const sunLight = new THREE.PointLight(0xffffff, 2, 1000);
        scene.add(sunLight);

        // ၂။ နောက်ခံ ကြယ်စင်များ (Starfield Particles)
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 4000;
        const starPositions = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 1500;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1 });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // ၃။ နေ (Sun)
        const sunGeo = new THREE.SphereGeometry(15, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sun);

        // ၄။ Asteroid Belt (ဥက္ကာခဲခါးပတ် - InstancedMesh သုံး၍ performance ကောင်းအောင် ဖန်တီးခြင်း)
        const asteroidCount = 2000;
        const asteroidGeo = new THREE.DodecahedronGeometry(0.6, 1);
        const asteroidMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 });
        const asteroidBelt = new THREE.InstancedMesh(asteroidGeo, asteroidMat, asteroidCount);
        
        const dummy = new THREE.Object3D();
        for (let i = 0; i < asteroidCount; i++) {
            // အင်္ဂါဂြိုဟ်နှင့် ဂျူပီတာကြား အကွာအဝေး (ဥပမာ: radius 90 မှ 130 ကြား)
            const radius = 95 + Math.random() * 35;
            const angle = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 8; // ဒေါင်လိုက် အနည်းငယ် ပြန့်ကျဲစေခြင်း

            dummy.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
            dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            const scale = 0.5 + Math.random() * 1.5;
            dummy.scale.set(scale, scale, scale);
            dummy.updateMatrix();

            asteroidBelt.setMatrixAt(i, dummy.matrix);
        }
        scene.add(asteroidBelt);

        // ၅။ ဂြိုဟ်အချို့ ထည့်သွင်းခြင်း (နမူနာ ကမ္ဘာ)
        const earthGeo = new THREE.SphereGeometry(4, 32, 32);
        const earthMat = new THREE.MeshStandardMaterial({ color: 0x2233ff, roughness: 0.5 });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        scene.add(earth);

        // Animation Loop
        let earthAngle = 0;
        function animate() {
            requestAnimationFrame(animate);

            // နေလည်ပတ်မှု
            sun.rotation.y += 0.002;

            // ဥက္ကာခဲများ တစ်ပြိုင်နက် လှည့်ပတ်ခြင်း
            asteroidBelt.rotation.y += 0.0008;

            // ကမ္ဘာဂြိုဟ် ပတ်လမ်းအတိုင်း လည်ပတ်ခြင်း
            earthAngle += 0.005;
            earth.position.x = Math.cos(earthAngle) * 60;
            earth.position.z = Math.sin(earthAngle) * 60;
            earth.rotation.y += 0.01;

            renderer.render(scene, camera);
        }
        animate();

        // Responsive Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
