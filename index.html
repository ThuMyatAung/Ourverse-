<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System & Mythological Asteroids Observatory</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #010206; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* Top Navigation & Controls */
        #top-bar {
            position: absolute; top: 16px; left: 16px; z-index: 100;
            background: rgba(10, 15, 26, 0.8); backdrop-filter: blur(12px);
            padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
            display: flex; gap: 10px; align-items: center; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        #top-bar h1 { margin: 0; font-size: 15px; color: #64b5f6; font-weight: 600; }
        select, button {
            padding: 8px 12px; background: #1e293b; color: #fff;
            border: 1px solid #475569; border-radius: 8px; font-size: 13px;
            cursor: pointer; outline: none; transition: 0.2s;
        }
        select:focus, button:hover { border-color: #64b5f6; background: #243248; }

        /* Bottom Floating HUD Panel (Translucent Glassmorphism) */
        #bottom-hud {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 820px; z-index: 100;
            background: rgba(10, 16, 28, 0.85); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px;
            padding: 20px 24px; color: #e2e8f0; display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .hud-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .hud-title-area h2 { margin: 0; font-size: 18px; color: #ffffff; }
        .hud-badge {
            display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px;
            font-weight: 600; margin-top: 4px; background: rgba(100, 181, 246, 0.2); color: #64b5f6;
        }
        .close-btn {
            background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; padding: 0 4px;
        }
        .close-btn:hover { color: #fff; }

        .hud-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px; font-size: 12.5px; line-height: 1.5;
        }
        .hud-box {
            background: rgba(255, 255, 255, 0.04); padding: 10px 12px;
            border-radius: 8px; border-left: 3px solid #38bdf8;
        }
        .hud-box.myth { border-left-color: #f59e0b; }
        .hud-box.history { border-left-color: #a855f7; grid-column: span 2; }
        .hud-box b { color: #93c5fd; display: inline-block; margin-bottom: 2px; }
        .hud-box.myth b { color: #fcd34d; }
        .hud-box.history b { color: #d8b4fe; }

        @media (max-width: 600px) {
            .hud-box.history { grid-column: span 1; }
            #bottom-hud { width: 95%; bottom: 12px; padding: 14px; }
        }
    </style>
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="top-bar">
        <h1>Cosmic Observatory</h1>
        <select id="target-selector">
            <option value="Overview">-- Overview (အဝေးမှ အပြည့်အစုံ ကြည့်မည်) --</option>
            <optgroup label="Major Planets (အဓိက ဂြိုဟ်ကြီးများ)" id="planets-opt"></optgroup>
            <optgroup label="Deity Asteroids (နတ်ဘုရားအမည်ခံ ဥက္ကာခဲများ)" id="asteroids-opt"></optgroup>
        </select>
        <button id="reset-cam-btn">Reset View</button>
    </div>

    <!-- Bottom Translucent Information HUD -->
    <div id="bottom-hud">
        <div class="hud-header">
            <div class="hud-title-area">
                <h2 id="hud-name">Object Name</h2>
                <div class="hud-badge" id="hud-type">Asteroid / Main Belt</div>
            </div>
            <button class="close-btn" id="hud-close">&times;</button>
        </div>
        <div class="hud-grid">
            <div class="hud-box">
                <b>ရှာဖွေတွေ့ရှိမှု (Discovery)</b><br>
                ခုနှစ် - <span id="hud-year"></span><br>
                တွေ့ရှိသူ - <span id="hud-discoverer"></span>
            </div>
            <div class="hud-box">
                <b>ပတ်လမ်းဆိုင်ရာ အချက်အလက် (Orbital Data)</b><br>
                နေမှ အကွာအဝေး - <span id="hud-orbit"></span><br>
                ကြာချိန် - <span id="hud-period"></span>
            </div>
            <div class="hud-box myth">
                <b>နတ်ဘုရားဒဏ္ဍာရီ (Mythology)</b><br>
                <span id="hud-myth"></span>
            </div>
            <div class="hud-box history">
                <b>သမိုင်းမှတ်တိုင်နှင့် မစ်ရှင်များ (History & NASA Missions)</b><br>
                <span id="hud-history"></span>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // ၁။ SCENE, CAMERA, RENDERER
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 80000);
        camera.position.set(0, 420, 650);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1;
        controls.maxDistance = 12000;

        // Lighting
        scene.add(new THREE.AmbientLight(0x222838));
        const sunLight = new THREE.PointLight(0xffffff, 2.6, 20000, 0.4);
        scene.add(sunLight);

        // ၂။ PROCEDURAL NASA-STYLE TEXTURE GENERATOR
        // NASA မှ ရိုက်ကူးထားသည့် ချိုင့်ခွက် (craters) များနှင့် မညီညာသော ကျောက်မြေသားပုံစံ ထုတ်ပေးခြင်း
        function generateNasaTexture(type, baseColor, detailColor, hasBrightSpots = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Regolith Noise & Cratering
            for (let i = 0; i < 900; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const r = Math.random() * (type === 'gas' ? 140 : 18);
                
                ctx.fillStyle = detailColor;
                ctx.globalAlpha = 0.09;
                ctx.beginPath();
                if (type === 'gas') {
                    ctx.rect(0, y, canvas.width, Math.random() * 25);
                } else {
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                }
                ctx.fill();

                // Craters with shadows
                if (type === 'asteroid' && Math.random() > 0.6) {
                    ctx.fillStyle = "#000000";
                    ctx.globalAlpha = 0.15;
                    ctx.beginPath();
                    ctx.arc(x + 2, y + 2, r * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Ceres' Occator Crater Bright Spot (ဆားတွင်း အဖြူစက်များ)
            if (hasBrightSpots) {
                ctx.fillStyle = "#ffffff";
                ctx.globalAlpha = 0.85;
                ctx.beginPath();
                ctx.arc(512, 256, 12, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // Distance formula (Semi-Logarithmic)
        function getVisualDistance(au) {
            return 82 * Math.pow(au, 0.52);
        }

        // Label Generator (Canvas Sprite)
        function createLabel(text, color = "#ffffff") {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 22px sans-serif';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.fillText(text, 128, 42);
            
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
            sprite.scale.set(22, 5.5, 1);
            return sprite;
        }

            { name: "Earth", myan: "ကမ္ဘာဂြိုဟ်", a: 1.000, e: 0.017, radius: 4.8, base: "#2563eb", detail: "#16a34a", period: "365.2 ရက်", year: "-", discoverer: "လူသားများ၏ မွေးရပ်မြေ", desc: "မျက်နှာပြင်တွင် အရည်အသွေးရှိသော ရေထုနှင့် သက်ရှိများ ရှင်သန်နိုင်သည့် တစ်ခုတည်းသော ဂြိုဟ်။", myth: "ဂရိ/ရိုမန် မြေကမ္ဘာစောင့်နတ်ဘုရားမ (ဂိုင်ယာ/တာရာ)", hasClouds: true },
            { name: "Mars", myan: "အင်္ဂါဂြိုဟ်", a: 1.524, e: 0.093, radius: 3.2, base: "#dc2626", detail: "#991b1b", period: "687 ရက်", year: "ရှေးခေတ်", discoverer: "လူသိများပြီးဖြစ်", desc: "သံအောက်ဆိုဒ်များ ဖုံးလွှမ်းနေသော ဂြိုဟ်နီကြီး။ NASA Perseverance နှင့် Curiosity ယာဉ်များ ရှိနေသည်။", myth: "ရိုမန် စစ်ပွဲနတ်ဘုရား (မားစ်)" },

            { name: "Saturn", myan: "စနေဂြိုဟ်", a: 9.582, e: 0.056, radius: 11.0, base: "#fde047", detail: "#ca8a04", period: "29.45 နှစ်", year: "ရှေးခေတ်", discoverer: "လူသိများပြီးဖြစ်", type: "gas", hasRing: true, desc: "ရေခဲနှင့် ကျောက်စများဖြင့် ဖွဲ့စည်းထားသော အလွန်လှပသည့် ကွင်းကြီးများ ပိုင်ဆိုင်သည်။", myth: "ရိုမန် စိုက်ပျိုးရေးနှင့် အချိန်နတ်ဘုရား (Saturnus)" },

            { name: "Neptune", myan: "နက်ပကျွန်းဂြိုဟ်", a: 30.05, e: 0.010, radius: 7.0, base: "#4f46e5", detail: "#3730a3", period: "164.8 နှစ်", year: "၁၈၄၆", discoverer: "အာဘန်း လီဗဲရီယဲ နှင့် ယိုဟန် ဂဲလ်", desc: "အမြန်ဆုံး မုန်တိုင်းလေပြင်းများ တိုက်ခတ်ရာ အဝေးဆုံး ရေခဲဧရာမဂြိုဟ်။", myth: "ရိုမန် ပင်လယ်စောင့်နတ်ဘုရား (နက်ပကျွန်း / ပိုဆိုင်ဒွန်)" }

        const godAsteroidsData = [

            { name: "1862 Apollo", a: 1.470, e: 0.560, radius: 0.85, period: "1.78 နှစ်", year: "၁၉၃၂ (ဧပြီ ၂၄)", discoverer: "ကားလ် ရိန်းမွတ် (Karl Reinmuth)", myth: "ဂရိ အလင်းရောင်နှင့် နေနတ်ဘုရား (အပိုလို)", desc: "ကမ္ဘာ့ပတ်လမ်းကို ဖြတ်ကျော်သွားလာသော Apollo-class ဥက္ကာခဲအုပ်စုကို အမည်ပေးစေခဲ့သည့် အရင်းခံဥက္ကာခဲ။" },
            { name: "2060 Chiron", a: 13.67, e: 0.383, radius: 1.1, period: "50.5 နှစ်", year: "၁၉၇၇ (အောက်တိုဘာ ၁၈)", discoverer: "ချားလ်စ် ကိုဝါလ် (Charles Kowal)", myth: "ဂရိ ဆေးပညာနှင့် ပညာရှင် ဆင်းတော ကေရွန်", desc: "Saturn နှင့် Uranus ကြား လှည့်ပတ်နေသည့် ပထမဆုံး Centaur အရာဝတ္ထုဖြစ်ပြီး ကြယ်တံခွန်ကဲ့သို့ အမြီးထွက်လေ့ရှိသည်။" },
            { name: "3200 Phaethon", a: 1.271, e: 0.890, radius: 0.85, period: "523 ရက်", year: "၁၉၈၃ (အောက်တိုဘာ ၁၁)", discoverer: "IRAS ဂြိုဟ်တုအဖွဲ့", myth: "ဂရိ နေရထားမောင်းနှင်သူ ဖီတွန်", desc: "ဒီဇင်ဘာလတိုင်း တွေ့ရသည့် နာမည်ကျော် Geminid ကြယ်ကြွေမိုးကို ဖြစ်ပေါ်စေသော မိခင်ဥက္ကာခဲကျောက်တုံးကြီး။" },
            { name: "99942 Apophis", a: 0.922, e: 0.191, radius: 0.75, period: "323 ရက်", year: "၂၀၀၄ (ဇွန် ၁၉)", discoverer: "Roy Tucker, David Tholen et al.", myth: "အီဂျစ် အမှောင်ထုနှင့် ဖျက်ဆီးခြင်း နတ်ဘုရား", desc: "၂၀၂၉ ဧပြီ ၁၃ တွင် ကမ္ဘာမြေနှင့် မိုင်ပေါင်း ၂၀,၀၀၀ အကွာ (ဂြိုဟ်တုများထက် ပိုနီးကပ်စွာ) ဘေးကင်းစွာ ဖြတ်သန်းမည်ဖြစ်သည်။" },
            { name: "101955 Bennu", a: 1.126, e: 0.203, radius: 0.8, period: "436 ရက်", year: "၁၉၉၉ (စက်တင်ဘာ ၁၁)", discoverer: "LINEAR စီမံကိန်း", myth: "အီဂျစ် နေနတ်ဘုရားနှင့် ပြန်လည်မွေးဖွားခြင်းငှက်", desc: "စိန်တုံးပုံ Rubble-pile ဥက္ကာခဲ။ NASA OSIRIS-REx ယာဉ်သည် မြေသားနမူနာရယူပြီး ၂၀၂၃ စက်တင်ဘာတွင် ကမ္ဘာသို့ အောင်မြင်စွာ ပြန်သယ်ဆောင်ခဲ့သည်။", shape: "diamond" },
            { name: "162173 Ryugu", a: 1.190, e: 0.190, radius: 0.8, period: "474 ရက်", year: "၁၉၉၉ (မေ ၁၀)", discoverer: "LINEAR စီမံကိန်း", myth: "ဂျပန် ပင်လယ်နဂါးမင်း နန်းတော် (Ryūgū-jō)", desc: "ဂျပန် JAXA Hayabusa2 ယာဉ်သည် ၂၀၁၈ တွင် သွားရောက်ခဲ့ပြီး မြေသားနမူနာများကို ကမ္ဘာသို့ အောင်မြင်စွာ သယ်ဆောင်ပေးခဲ့သည်။", shape: "diamond" },
            { name: "50000 Quaoar", a: 43.69, e: 0.038, radius: 1.8, period: "288 နှစ်", year: "၂၀၀၂ (ဇွန် ၄)", discoverer: "Chad Trujillo & Mike Brown", myth: "Tongva (အမေရိကန်ဒေသခံ) ဖန်ဆင်းရှင်နတ်ဘုရား", desc: "Kuiper Belt ထဲမှ ထူးခြားသော ရေခဲဂြိုဟ်သိမ်ဖြစ်ပြီး သီအိုရီအရ မဖြစ်နိုင်ဟုယူဆရသော ကွင်းစနစ် (Rings) တစ်ခု ရှိနေသည်။" },
            { name: "90377 Sedna", a: 525.8, e: 0.855, radius: 1.7, period: "၁၁,၄၀၀ နှစ်", year: "၂၀၀၃ (နိုဝင်ဘာ ၁၄)", discoverer: "Brown, Trujillo & Rabinowitz", myth: "Inuit (အင်းနုအစ်) ရေခဲပင်လယ်စောင့် နတ်ဘုရားမ", desc: "Oort Cloud နယ်စပ်အနီး အလွန်အေးခဲဝေးကွာလှပြီး တစ်ပတ်ပြည့်ရန် နှစ်ပေါင်း ၁ သောင်းကျော် ကြာမြင့်သည့် အနီရောင်ဂြိုဟ်သိမ်။" },
            { name: "90482 Orcus", a: 39.41, e: 0.226, radius: 1.6, period: "247 နှစ်", year: "၂၀၀၄ (ဖေဖော်ဝါရီ ၁၇)", discoverer: "Brown, Trujillo & Rabinowitz", myth: "ရိုမန် ငရဲဘုံအရှင် နတ်ဘုရား", desc: "ပလူတိုနှင့် ပတ်လမ်းသဘောတရား ဆန့်ကျင်ဘက်တူညီသဖြင့် 'Anti-Pluto' ဟု တင်စားခေါ်ဝေါ်ကြသည်။" },
            { name: "136108 Haumea", a: 43.21, e: 0.191, radius: 1.9, period: "284 နှစ်", year: "၂၀၀၄", discoverer: "Sierra Nevada / Caltech အဖွဲ့", myth: "ဟာဝိုင်အီ သားဖွားခြင်းနှင့် မြေဩဇာနတ်ဘုရားမ", desc: "အလွန်မြန်သော ၃.၉ နာရီတစ်ကြိမ် လည်ပတ်မှုကြောင့် ဘဲဥပုံ/ရဂ်ဘီဘောလုံးသဏ္ဌာန် ဆန့်ထွက်နေသည့် ရေခဲ Dwarf Planet။", shape: "elongated" },
            { name: "136199 Eris", a: 67.78, e: 0.441, radius: 2.3, period: "558 နှစ်", year: "၂၀၀၅ (ဇန်နဝါရီ ၅)", discoverer: "Mike Brown, Trujillo, Rabinowitz", myth: "ဂရိ မငြိမ်မသက်မှုနှင့် အငြင်းပွားခြင်း နတ်ဘုရားမ", desc: "ဤဂြိုဟ်သိမ်ကို တွေ့ရှိမှုကြောင့် ၂၀၀၆ ခုနှစ်တွင် ပလူတိုကို ဂြိုဟ်စာရင်းမှ ပယ်ဖျက်ကာ Dwarf Planet စာရင်းသို့ ပြောင်းလဲစေခဲ့သည်။" },
            { name: "136472 Makemake", a: 45.79, e: 0.159, radius: 2.0, period: "309 နှစ်", year: "၂၀၀၅ (မတ် ၃၁)", discoverer: "Mike Brown ဦးဆောင်သောအဖွဲ့", myth: "Rapa Nui (အီစတာကျွန်း) လူသားဖန်ဆင်းရှင်နတ်ဘုရား", desc: "မက်သနိန်းနှင့် အီသနိန်း ရေခဲများ ဖုံးလွှမ်းနေသဖြင့် Kuiper Belt တွင် အတောက်ပဆုံး အရာဝတ္ထုများထဲမှ တစ်ခုဖြစ်သည်။" }
        ];

        // ၄။ SUN CREATION
        const sunGeo = new THREE.SphereGeometry(22, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xfff0a0 });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sunMesh);
        const sunLabel = createLabel("Sun", "#fff0a0");
        sunMesh.add(sunLabel);

        // Orbit Line Drawer
        function createOrbitPath(a_AU, e, color) {
            const points = [];
            const segments = 128;
            const a = getVisualDistance(a_AU);
            const b = a * Math.sqrt(Math.max(0.001, 1 - e * e));
            const c = a * e;

            for (let i = 0; i <= segments; i++) {
                const theta = (i / segments) * Math.PI * 2;
                points.push(new THREE.Vector3(a * Math.cos(theta) - c, 0, b * Math.sin(theta)));
            }
            return new THREE.LineLoop(
                new THREE.BufferGeometry().setFromPoints(points),
                new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.3 })
            );
        }

        // ၅။ BUILD BODIES WITH NASA-LIKE IRREGULAR GEOMETRY
        const allBodies = [];
        const planetsOpt = document.getElementById('planets-opt');
        const asteroidsOpt = document.getElementById('asteroids-opt');

        function registerCelestialBody(data, isAsteroid = false) {
            scene.add(createOrbitPath(data.a, data.e, isAsteroid ? 0x00e5ff : 0x475569));

            // NASA Irregular Shape Generation (Potato / Diamond / Flattened)
            let geo;
            if (isAsteroid) {
                geo = new THREE.DodecahedronGeometry(data.radius, 2);
                // Vertex perturbation for realistic rocky roughness
                const pos = geo.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const vx = pos.getX(i);
                    const vy = pos.getY(i);
                    const vz = pos.getZ(i);
                    const noise = 1 + (Math.sin(vx * 3) + Math.cos(vy * 3) + Math.sin(vz * 3)) * 0.08;
                    pos.setXYZ(i, vx * noise, vy * noise, vz * noise);
                }
                geo.computeVertexNormals();
            } else {
                geo = new THREE.SphereGeometry(data.radius, 32, 32);
            }

            const texture = generateNasaTexture(
                data.type || (isAsteroid ? 'asteroid' : 'planet'),
                data.base || "#64748b",
                data.detail || "#334155",
                data.hasBrightSpots || false
            );

            const mat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: data.isMetal ? 0.3 : 0.85,
                metalness: data.isMetal ? 0.8 : 0.05
            });

            const mesh = new THREE.Mesh(geo, mat);

            // Shape Specific Scaling (Eros, Ryugu, Haumea)
            if (data.shape === "elongated") {
                mesh.scale.set(1.7, 0.9, 0.8);
            } else if (data.shape === "diamond") {
                mesh.scale.set(1.2, 0.85, 1.2);
            }

            // Saturn's Rings
            if (data.hasRing) {
                const ringGeo = new THREE.RingGeometry(data.radius + 2.5, data.radius + 10, 48);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xd7ccc8, side: THREE.DoubleSide, transparent: true, opacity: 0.75 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.3;
                mesh.add(ring);
            }

            // Atmosphere / Clouds for Earth
            let cloudsMesh = null;
            if (data.hasClouds) {
                const cloudGeo = new THREE.SphereGeometry(data.radius + 0.12, 32, 32);
                const cloudMat = new THREE.MeshStandardMaterial({
                    map: generateNasaTexture('gas', '#ffffff', '#93c5fd'),
                    transparent: true,
                    opacity: 0.38
                });
                cloudsMesh = new THREE.Mesh(cloudGeo, cloudMat);
                mesh.add(cloudsMesh);
            }

            // In-Scene 3D Label
            const label = createLabel(data.name, isAsteroid ? "#38bdf8" : "#ffffff");
            label.position.y = data.radius + (isAsteroid ? 2.5 : 4.5);
            mesh.add(label);

            scene.add(mesh);
            const bodyObj = { mesh, label, cloudsMesh, data, angle: Math.random() * Math.PI * 2, isAsteroid };
            allBodies.push(bodyObj);

            // Populate Dropdown
            const opt = document.createElement('option');
            opt.value = data.name;
            opt.innerText = data.name + (data.myan ? ` (${data.myan})` : '');
            (isAsteroid ? asteroidsOpt : planetsOpt).appendChild(opt);
        }

        planetsData.forEach(p => registerCelestialBody(p, false));
        godAsteroidsData.forEach(a => registerCelestialBody(a, true));

        // ၆။ INSTANCED MESH FOR ASTEROID BELT (3,000 Rocks)
        const beltCount = 3000;
        const asteroidBelt = new THREE.InstancedMesh(
            new THREE.DodecahedronGeometry(0.35, 0),
            new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.9 }),
            beltCount
        );
        const dummy = new THREE.Object3D();
        for (let i = 0; i < beltCount; i++) {
            const au = 2.1 + Math.random() * 1.1;
            const dist = getVisualDistance(au);
            const angle = Math.random() * Math.PI * 2;
            dummy.position.set(Math.cos(angle) * dist, (Math.random() - 0.5) * 8, Math.sin(angle) * dist);
            dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            const s = 0.3 + Math.random() * 1.0;
            dummy.scale.set(s, s, s);
            dummy.updateMatrix();
            asteroidBelt.setMatrixAt(i, dummy.matrix);
        }
        scene.add(asteroidBelt);

        // ၇။ STARFIELD PARTICLES
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 5000;
        const starPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            const rad = 3500 + Math.random() * 4000;
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            starPos[i] = rad * Math.sin(phi) * Math.cos(theta);
            starPos[i+1] = rad * Math.sin(phi) * Math.sin(theta);
            starPos[i+2] = rad * Math.cos(phi);
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0x93c5fd, size: 1.8 })));

        // ၈။ INTERACTIVE TARGET TRACKING & CLOSE-UP FRAMING
        let currentTarget = null;
        let targetCamDistance = 40;
        const bottomHud = document.getElementById('bottom-hud');

        function setFocus(name) {
            // Restore visibility of previous label
            if (currentTarget && currentTarget.label) {
                currentTarget.label.visible = true;
            }

            if (name === "Overview") {
                currentTarget = null;
                bottomHud.style.display = "none";
                return;
            }

            const found = allBodies.find(b => b.data.name === name);
            if (found) {
                currentTarget = found;
                // ပစ်မှတ်အနီးသို့ Zoom ဆွဲချိန်တွင် 3D Label ကြောင့် မကွယ်စေရန် Label ကို ဖျောက်ထားခြင်း
                found.label.visible = false;

                // ကင်မရာ Fit ချိန်ညှိမှု - ဂြိုဟ်အဆမတန် မကြီးနေစေရန် (radius x 4.8) သင့်တော်စွာ ချိန်ညှိထားခြင်း
                targetCamDistance = Math.max(found.data.radius * 4.8, 6.5);

                // Update Bottom Translucent HUD
                document.getElementById('hud-name').innerText = found.data.name + (found.data.myan ? ` (${found.data.myan})` : '');
                document.getElementById('hud-type').innerText = found.isAsteroid ? "Asteroid / Small Body" : "Major Planet";
                document.getElementById('hud-year').innerText = found.data.year || "-";
                document.getElementById('hud-discoverer').innerText = found.data.discoverer || "-";
                document.getElementById('hud-orbit').innerText = `${found.data.a} AU`;
                document.getElementById('hud-period').innerText = found.data.period;
                document.getElementById('hud-myth').innerText = found.data.myth || "-";
                document.getElementById('hud-history').innerText = found.data.desc || "-";

                bottomHud.style.display = "block";
            }
        }

        document.getElementById('target-selector').addEventListener('change', (e) => setFocus(e.target.value));
        document.getElementById('hud-close').addEventListener('click', () => {
            document.getElementById('target-selector').value = "Overview";
            setFocus("Overview");
        });
        document.getElementById('reset-cam-btn').addEventListener('click', () => {
            document.getElementById('target-selector').value = "Overview";
            setFocus("Overview");
            controls.target.set(0, 0, 0);
            camera.position.set(0, 420, 650);
        });

        // ၉။ ANIMATION LOOP
        const simSpeed = 0.35;
        function animate() {
            requestAnimationFrame(animate);

            sunMesh.rotation.y += 0.002;
            asteroidBelt.rotation.y += 0.0003;

            // Orbital Motion (Kepler Ellipse)
            allBodies.forEach(obj => {
                const { mesh, cloudsMesh, data } = obj;
                // Approximate speed based on distance
                obj.angle += (0.015 / Math.pow(data.a, 0.75)) * simSpeed;

                const a = getVisualDistance(data.a);
                const b = a * Math.sqrt(Math.max(0.001, 1 - data.e * data.e));
                mesh.position.x = a * Math.cos(obj.angle) - (a * data.e);
                mesh.position.z = b * Math.sin(obj.angle);
                mesh.rotation.y += 0.014;

                if (cloudsMesh) cloudsMesh.rotation.y += 0.018;
            });

            // Smooth Camera Follow & Auto-Framing
            if (currentTarget) {
                const targetPos = currentTarget.mesh.position;
                controls.target.lerp(targetPos, 0.08);

                // Smoothly maintain balanced camera framing distance
                const camOffset = camera.position.clone().sub(controls.target).normalize().multiplyScalar(targetCamDistance);
                camera.position.lerp(targetPos.clone().add(camOffset), 0.06);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
