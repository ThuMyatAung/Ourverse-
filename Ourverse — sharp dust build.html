<!DOCTYPE html>
<html lang="my">
<head>

    <title>Cosmic Observatory 3D: Complete Solar System, All Asteroids, Constellations & Live AR</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #010206; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
        
        #camera-feed {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 1; display: none;
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 2; }

        /* Unified Top Navigation Bar */
        #top-bar {
            position: absolute; top: 12px; left: 12px; right: 12px; z-index: 100;
            background: rgba(10, 16, 30, 0.92); backdrop-filter: blur(16px);
            padding: 10px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15);
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
            box-shadow: 0 10px 35px rgba(0,0,0,0.8);
        }
        .mode-toggle { display: flex; background: #1e293b; border-radius: 8px; padding: 2px; }
        .mode-btn {
            background: transparent; border: none; color: #94a3b8; padding: 6px 12px;
            font-size: 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 500;
        }
        .mode-btn.active { background: #0284c7; color: #ffffff; font-weight: 600; }
        
        select, .action-btn {
            padding: 6px 10px; background: #1e293b; color: #fff;
            border: 1px solid #475569; border-radius: 8px; font-size: 12px;
            cursor: pointer; outline: none; transition: 0.2s; white-space: nowrap;
        }
        select:focus, .action-btn:hover { border-color: #38bdf8; background: #243248; }

        .divider { width: 1px; height: 22px; background: rgba(255,255,255,0.15); margin: 0 4px; }

        /* AR Compass / Real-time Tracker Guide HUD */
        #ar-hud {
            position: absolute; top: auto; bottom: 14px; left: 50%; transform: translateX(-50%);
            flex-wrap: wrap; justify-content: center; max-width: 94vw; row-gap: 4px;
            background: rgba(10, 16, 28, 0.92); backdrop-filter: blur(14px);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 20px;
            padding: 8px 18px; font-size: 12px; color: #38bdf8; z-index: 90;
            display: none; align-items: center; gap: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            text-align: center;
        }
        .hud-pill { background: rgba(56, 189, 248, 0.2); padding: 2px 8px; border-radius: 6px; font-weight: 700; color: #7dd3fc; }

        /* Bottom Split-Screen Inspection Sheet */
        #inspection-sheet {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 920px; height: 45vh; min-height: 290px; z-index: 150;
            background: rgba(10, 16, 28, 0.95); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.2); border-radius: 22px 22px 0 0;
            box-shadow: 0 -15px 45px rgba(0,0,0,0.85); display: none; flex-direction: column;
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }

        .sheet-header {
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .preview-circle {
            width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.4); flex-shrink: 0;
        }
        .sheet-title h2 { margin: 0; font-size: 17px; color: #fff; }
        .sheet-title p { margin: 2px 0 0 0; font-size: 11.5px; color: #94a3b8; }
        
        .sheet-close-btn {
            background: rgba(255,255,255,0.08); border: none; color: #cbd5e1;
            width: 32px; height: 32px; border-radius: 50%; font-size: 18px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .sheet-close-btn:hover { background: rgba(239, 68, 68, 0.3); color: #ef4444; }
        #inspection-sheet.sheet-collapsed { height: auto; min-height: 0; }
        #inspection-sheet.sheet-collapsed .sheet-body { display: none; }
        .sheet-head-btns { display: flex; gap: 8px; align-items: center; }

        .sheet-body {
            padding: 16px 22px 35px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
        }
        .info-card {
            background: rgba(255, 255, 255, 0.04); border-radius: 10px;
            padding: 14px; line-height: 1.6; font-size: 13px; border-left: 4px solid #38bdf8;
        }
        .info-card h4 { margin: 0 0 6px 0; font-size: 13.5px; color: #93c5fd; }
        .info-card p { margin: 0; color: #cbd5e1; }
        .info-card.missions { border-left-color: #a855f7; }
        .info-card.missions h4 { color: #d8b4fe; }
        .info-card.myth-section { border-left-color: #f59e0b; background: rgba(245, 158, 11, 0.04); }
        .info-card.myth-section h4 { color: #fcd34d; font-size: 14px; }
        #sim-time-input { padding: 6px 8px; background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 8px; font-size: 12px; color-scheme: dark; }
    </style>

    <div id="canvas-container"></div>

    <script>
        // ၁။ SCENE, CAMERA & RENDERER SETUP
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 95000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x010206, 1);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.minDistance = 3.5;
        controls.maxDistance = 1600;
        controls.dampingFactor = 0.05;

        // SCENE GROUPS
        const solarGroup = new THREE.Group();
        const constellationGroup = new THREE.Group();
        const arSkyGroup = new THREE.Group();
        scene.add(solarGroup);
        scene.add(constellationGroup);
        scene.add(arSkyGroup);
        constellationGroup.visible = false;
        arSkyGroup.visible = false;

        const OVERVIEW_CAM = new THREE.Vector3(0, 480, 750);
        const OVERVIEW_TARGET = new THREE.Vector3(0, 0, 0);
        camera.position.copy(OVERVIEW_CAM);
        controls.target.copy(OVERVIEW_TARGET);

        // Lighting
        solarGroup.add(new THREE.AmbientLight(0x334155));
        const sunLight = new THREE.PointLight(0xffffff, 2.8, 30000, 0.3);
        solarGroup.add(sunLight);

        constellationGroup.add(new THREE.AmbientLight(0xffffff, 1.2));
        arSkyGroup.add(new THREE.AmbientLight(0xffffff, 1.5));

        function getVisualDistance(au) { return 82 * Math.pow(au, 0.52); }

        // Glowing Star Texture Generator (Ensures stars are bright, visible jewels on camera)
        function createGlowingStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(125, 211, 252, 0.8)');
            gradient.addColorStop(0.8, 'rgba(56, 189, 248, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const glowingStarTex = createGlowingStarTexture();
        // Sharp dust texture: solid core, very tight falloff — reads as a star grain, not a bubble
        const dustTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 64; const x = c.getContext('2d'); const g = x.createRadialGradient(32, 32, 0, 32, 32, 30); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.18, 'rgba(255,255,255,0.95)'); g.addColorStop(0.42, 'rgba(255,255,255,0.28)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();

        function createLabelSprite(text, color = "#ffffff") {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = color; ctx.textAlign = 'center';
            ctx.fillText(text, 128, 40);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
            sprite.scale.set(24, 6, 1);
            return sprite;
        }

        // ၂။ TRUE ASTRONOMICAL HORIZON MATH (Alt/Az Calculation)
        let userLat = 16.8409, userLon = 96.1735; // Default: Yangon, Myanmar
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                userLat = pos.coords.latitude; userLon = pos.coords.longitude;
            }, () => {});
        }

        function getLST(date, lonDeg) {
            const jd = (date.getTime() / 86400000) + 2440587.5;
            const d = jd - 2451545.0;
            let gmst = (18.697374558 + 24.06570982441908 * d) % 24;
            if (gmst < 0) gmst += 24;
            let lst = (gmst + lonDeg / 15.0) % 24;
            if (lst < 0) lst += 24;
            return lst * 15.0 * (Math.PI / 180);
        }

        function getHorizontalVector(raHours, decDeg, radius = 800) {
            const date = new Date();
            const ra = raHours * 15.0 * (Math.PI / 180);
            const dec = decDeg * (Math.PI / 180);
            const lat = userLat * (Math.PI / 180);
            const lst = getLST(date, userLon);
            const ha = lst - ra;

            const sinAlt = Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(ha);
            const alt = Math.asin(sinAlt);
            const cosAlt = Math.cos(alt);
            const sinAz = -Math.sin(ha) * Math.cos(dec) / (cosAlt || 0.0001);
            const cosAz = (Math.sin(dec) - Math.sin(lat) * sinAlt) / (Math.cos(lat) * (cosAlt || 0.0001));
            const az = Math.atan2(sinAz, cosAz);

            // Three.js Coordinates: North is -Z, East is +X, South is +Z, West is -X, Zenith is +Y
            return new THREE.Vector3(
                radius * Math.cos(alt) * Math.sin(az),
                radius * Math.sin(alt),
                -radius * Math.cos(alt) * Math.cos(az)
            );
        }

        // ၃။ COMPLETE DATA: 9 PLANETS, SUN, 28 ASTEROIDS, 20 CONSTELLATIONS
        const planetsData = [
            { name: "Mercury", myan: "ဗုဒ္ဓဟူးဂြိုဟ်", a: 0.387, e: 0.205, radius: 2.2, color: 0x78716c, ra: 2.5, dec: 14, period: "88 ရက်", discovery: "ရှေးဗာဗုလုံခေတ်ကတည်းက စတင်မှတ်တမ်းတင်ခဲ့သည်။", missions: "NASA MESSENGER (၂၀၁၁-၂၀၁၅) လေ့လာခဲ့သည်။", myth: "အလျင်မြန်ဆုံး ပြေးလွှားနိုင်သော ရောမနတ်တမန် မာကျူရီ အမည် ဖြစ်သည်။" },
            { name: "Venus", myan: "သောကြာဂြိုဟ်", a: 0.723, e: 0.007, radius: 4.5, color: 0xeab308, ra: 3.8, dec: 21, period: "224.7 ရက်", discovery: "၁၆၁၀ တွင် ဂယ်လီလီယိုက လဆန်း/လဆုတ် အဆင့်ဆင့်ဖြစ်ပေါ်မှုကို တွေ့ရှိခဲ့သည်။", missions: "ဆိုဗီယက် Venera မစ်ရှင်များ ဆင်းသက်ခဲ့သည်။", myth: "ညကောင်းကင်တွင် အတောက်ပဆုံး လက်ယာရတနာဖြစ်၍ အလှအပနတ်ဘုရားမ ဗီးနပ်စ် အမည် ပေးခဲ့သည်။" },
            { name: "Earth", myan: "ကမ္ဘာဂြိုဟ်", a: 1.000, e: 0.017, radius: 4.8, color: 0x0284c7, ra: 0, dec: 0, period: "365.2 ရက်", hasClouds: true, discovery: "လူသားတို့ မွေးရပ်မြေ ဖြစ်သည်။", missions: "Apollo 8 ၏ Earthrise ဓာတ်ပုံ သမိုင်းဝင်ခဲ့သည်။", myth: "သက်ရှိအားလုံး၏ မိခင်မြေစောင့်နတ်ဘုရားမ ဂိုင်ယာ (Gaia) ဖြစ်သည်။" },
            { name: "Mars", myan: "အင်္ဂါဂြိုဟ်", a: 1.524, e: 0.093, radius: 3.2, color: 0xdc2626, ra: 6.2, dec: 24, period: "687 ရက်", discovery: "၁၈၇၇ တွင် မျက်နှာပြင်မြောင်းများကို စတင်မှတ်တမ်းတင်ခဲ့သည်။", missions: "NASA Perseverance နှင့် Curiosity စက်ရုပ်များ ရှိနေသည်။", myth: "သွေးကဲ့သို့ နီရဲတောက်ပနေသောကြောင့် ရောမစစ်နတ်ဘုရား မားစ် အမည် ပေးခဲ့သည်။" },
            { name: "Jupiter", myan: "ကြာသပတေးဂြိုဟ်", a: 5.204, e: 0.048, radius: 13.5, color: 0xd97706, ra: 4.1, dec: 19, period: "11.86 နှစ်", discovery: "၁၆၁၀ တွင် ဂယ်လီလီယိုက လ ၄ စင်းကို စတင်တွေ့ရှိခဲ့သည်။", missions: "NASA Juno သည် မဟာအနီစက်ကြီးကို လေ့လာနေသည်။", myth: "ဂြိုဟ်အားလုံးထက် ထုထည်အကြီးမားဆုံးဖြစ်၍ နတ်ဘုရားတို့၏ ဘုရင် ဂျူပီတာ အမည် ပေးခဲ့သည်။" },

// Halley comet: elements + perihelion epoch (JD 2446467.4 = 1986-02-09)
const HALLEY = { a: 17.834, e: 0.96714, i: 162.2607, om: 58.420, w: 111.332, tp: 2446467.4, n: 0.013087 };

const DEG = Math.PI / 180;
function norm360(d) { d = d % 360; return d < 0 ? d + 360 : d; }

// Solve Kepler's equation M = E - e*sinE (radians in/out). Robust for e<0.97.
function solveKepler(M, e) {
  M = ((M % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  let E = e < 0.8 ? M + e * Math.sin(M) : Math.PI;
  for (let k = 0; k < 14; k++) {
    const dE = (M - (E - e * Math.sin(E))) / (1 - e * Math.cos(E));
    E += dE;
    if (Math.abs(dE) < 1e-10) break;
  }
  return E;
}

// Orbital elements -> heliocentric ecliptic rectangular coords (AU).
// el: {a, e, iDeg, omDeg, wDeg, MDeg} (mean anomaly already propagated to jd)
function elementsToXYZ(a, e, iDeg, omDeg, wDeg, MDeg) {
  const E = solveKepler(MDeg * DEG, e);
  const xp = a * (Math.cos(E) - e);
  const yp = a * Math.sqrt(1 - e * e) * Math.sin(E);
  const cw = Math.cos(wDeg * DEG), sw = Math.sin(wDeg * DEG);
  const cO = Math.cos(omDeg * DEG), sO = Math.sin(omDeg * DEG);
  const ci = Math.cos(iDeg * DEG), si = Math.sin(iDeg * DEG);
  const x = (cw * cO - sw * sO * ci) * xp + (-sw * cO - cw * sO * ci) * yp;
  const y = (cw * sO + sw * cO * ci) * xp + (-sw * sO + cw * cO * ci) * yp;
  const z = (sw * si) * xp + (cw * si) * yp;
  return { x, y, z };
}

// Planet position (JPL approximate elements, T = Julian centuries past J2000)
function planetPosition(name, jd) {
  const el = PLANET_ELEMENTS[name];
  if (!el) return null;
  const T = (jd - 2451545.0) / 36525;
  const a = el[0] + el[6] * T, e = el[1] + el[7] * T, I = el[2] + el[8] * T;
  const L = el[3] + el[9] * T, varpi = el[4] + el[10] * T, Om = el[5] + el[11] * T;
  const w = varpi - Om;
  const M = L - varpi;
  return elementsToXYZ(a, e, I, Om, w, M);
}

// Small-body position (SBDB osculating elements at epoch)
function smallBodyPosition(name, jd) {
  const el = ASTEROID_ELEMENTS[name];
  if (!el) return null;
  const M = el[5] + el[6] * (jd - el[7]);
  return elementsToXYZ(el[0], el[1], el[2], el[3], el[4], M);
}

// Halley position
function halleyPosition(jd) {
  const M = HALLEY.n * (jd - HALLEY.tp);
  return elementsToXYZ(HALLEY.a, HALLEY.e, HALLEY.i, HALLEY.om, HALLEY.w, M);
}

// Moon geocentric ecliptic position (AU), simplified lunar theory (~arcmin-level lon)
function moonPosition(jd) {
  const T = (jd - 2451545.0) / 36525;
  const Lp = norm360(218.3165 + 481267.8813 * T);
  const D = norm360(297.8502 + 445267.1115 * T);
  const M = norm360(357.5291 + 35999.0503 * T);
  const Mp = norm360(134.9634 + 477198.8676 * T);
  const F = norm360(93.2721 + 483202.0175 * T);
  const lon = Lp + 6.289 * Math.sin(Mp * DEG) + 1.274 * Math.sin((2 * D - Mp) * DEG)
    + 0.658 * Math.sin(2 * D * DEG) + 0.214 * Math.sin(2 * Mp * DEG)
    - 0.186 * Math.sin(M * DEG) - 0.114 * Math.sin(2 * F * DEG);
  const lat = 5.128 * Math.sin(F * DEG) + 0.281 * Math.sin((Mp + F) * DEG)
    + 0.278 * Math.sin((Mp - F) * DEG) + 0.173 * Math.sin((2 * D - F) * DEG);
  const distKm = 385001 - 20905 * Math.cos(Mp * DEG) - 3699 * Math.cos((2 * D - Mp) * DEG) - 2956 * Math.cos(2 * D * DEG);
  const r = distKm / 149597870.7;
  return {
    x: r * Math.cos(lat * DEG) * Math.cos(lon * DEG),
    y: r * Math.cos(lat * DEG) * Math.sin(lon * DEG),
    z: r * Math.sin(lat * DEG),
    lon, lat
  };
}

function julianDate(date) { return date.getTime() / 86400000 + 2440587.5; }

            const pts = []; const seg = 128;
            const a = getVisualDistance(a_AU), b = a * Math.sqrt(Math.max(0.001, 1 - e * e)), c = a * e;

                pts.push(new THREE.Vector3(a * Math.cos(th) - c, 0, b * Math.sin(th)));

                () => { /* texture missing -> keep the body's tuned solid colour */ });

        // Procedural rocky surface for asteroids that have no real photo map:
        // seeded greyscale noise + blotches, multiplied by the body's own colour.
        function makeRockTexture(seedStr) {
            let seed = 0; for (let i = 0; i < seedStr.length; i++) seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
            const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
            const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128;
            const cx = cv.getContext('2d');
            cx.fillStyle = '#b9b9b9'; cx.fillRect(0, 0, 256, 128);
            for (let i = 0; i < 2600; i++) {
                const g = 120 + Math.floor(rnd() * 110);
                cx.fillStyle = `rgb(${g},${g},${g})`;
                cx.fillRect(Math.floor(rnd() * 256), Math.floor(rnd() * 128), 1 + rnd() * 2, 1 + rnd() * 2);
            }
            for (let i = 0; i < 46; i++) {
                const x = rnd() * 256, y = rnd() * 128, r = 2 + rnd() * 8, g = 90 + Math.floor(rnd() * 70);
                const gr = cx.createRadialGradient(x, y, 0, x, y, r);
                gr.addColorStop(0, `rgba(${g},${g},${g},0.85)`); gr.addColorStop(1, 'rgba(0,0,0,0)');
                cx.fillStyle = gr; cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill();
            }
            const t = new THREE.CanvasTexture(cv);
            return t;
        }

        // Orbit path sampled from the SAME Kepler elements that move the body,
        // so the body always sits exactly on its drawn path.
        function buildOrbitLine(data, isAsteroid, color) {
            let pts = null;
            const pe = PLANET_ELEMENTS[data.name];
            const ae = ASTEROID_ELEMENTS[data.name];
            const seg = 180;
            if (pe) {
                const w = pe[4] - pe[5];
                pts = [];
                for (let i = 0; i <= seg; i++) pts.push(auToScene(elementsToXYZ(pe[0], pe[1], pe[2], pe[5], w, (i / seg) * 360)));
            } else if (ae) {
                pts = [];
                for (let i = 0; i <= seg; i++) pts.push(auToScene(elementsToXYZ(ae[0], ae[1], ae[2], ae[3], ae[4], (i / seg) * 360)));
            }
            if (!pts) return createOrbitPath(data.a, data.e, color);
            return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.3 }));

        (function applyEnrich() {
            const apply = (data) => {
                const e = data && ENRICH[data.name];
                if (e) { data.discovery = e.discovery; data.missions = e.missions; data.myth = e.myth; }
            };
            planetsData.forEach(apply);
            asteroidsData.forEach(apply);
            constellationsData.forEach(apply);
            if (sunMesh && sunMesh.userData && sunMesh.userData.data) apply(sunMesh.userData.data);
            trackedBodies.forEach(o => apply(o.data));
        })();

        // ၇။ COMPASS, GYROSCOPE & LIVE AR CAMERA CONTROLLER
        let isARActive = false;
        const video = document.getElementById('camera-feed');
        const arHud = document.getElementById('ar-hud');
        const hudAzimuth = document.getElementById('hud-azimuth');
        const hudAltitude = document.getElementById('hud-altitude');
        const hudGuide = document.getElementById('hud-guide');
        const hudMw = document.getElementById('hud-mw');
        const hudSensor = document.getElementById('hud-sensor');

        let skyYaw = 0, skyPitch = 0;
        let isPointerDown = false, prevX = 0, prevY = 0;
        let sensorAlpha = null, sensorBeta = null, sensorGamma = null;
        let sensorLastTs = 0, orientationAttached = false;

        function updateARCamera() {
            if (!isARActive) return;

            if (sensorAlpha !== null && sensorBeta !== null) {
                const alphaRad = THREE.MathUtils.degToRad(sensorAlpha + (window.orientation || 0));
                const betaRad = THREE.MathUtils.degToRad(sensorBeta);
                const gammaRad = THREE.MathUtils.degToRad(sensorGamma || 0);

                const euler = new THREE.Euler(betaRad - Math.PI / 2, alphaRad, -gammaRad, 'YXZ');
                const targetQ = new THREE.Quaternion().setFromEuler(euler);

                // Add manual touch offset if user swipes
                const offsetQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(skyPitch, skyYaw, 0, 'YXZ'));
                targetQ.multiply(offsetQ);
                // Smooth-follow the sensors (raw gyro/compass data jitters on phones)
                camera.quaternion.slerp(targetQ, 0.35);
            } else {
                camera.quaternion.setFromEuler(new THREE.Euler(skyPitch, skyYaw, 0, 'YXZ'));
            }

            // Update Azimuth and Compass Guide
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            let azDeg = Math.round(THREE.MathUtils.radToDeg(Math.atan2(dir.x, -dir.z)));
            if (azDeg < 0) azDeg += 360;
            const altDeg = Math.round(THREE.MathUtils.radToDeg(Math.asin(dir.y)));

            let cardinal = "North (မြောက်)";
            if (azDeg >= 45 && azDeg < 135) cardinal = "East (အရှေ့)";
            else if (azDeg >= 135 && azDeg < 225) cardinal = "South (တောင်)";
            else if (azDeg >= 225 && azDeg < 315) cardinal = "West (အနောက်)";

            hudAzimuth.innerText = `${azDeg}° (${cardinal})`;
            hudAltitude.innerText = `${altDeg}°`;

            const sensorOk = sensorLastTs && (Date.now() - sensorLastTs < 1500);
            hudSensor.innerText = sensorOk ? '✅ OK' : '❌';
            document.getElementById('hud-sensor-btn').style.display = sensorOk ? 'none' : 'inline-block';

            // Live Compass Guide: name whatever is actually in front of the camera right now
            let guideText = "💡 ဖုန်းကို မိုးပေါ်သို့ မော့ကြည့်ပါ သို့မဟုတ် ပွတ်ဆွဲပါ";
            if (arGuideTargets.length) {
                let best = null, bestScore = 1e18;
                for (const t of arGuideTargets) {
                    if (t.alt < -2) continue;
                    let dAz = Math.abs(t.az - azDeg); if (dAz > 180) dAz = 360 - dAz;
                    const dAlt = Math.abs(t.alt - altDeg);
                    const score = dAz * dAz + dAlt * dAlt;
                    if (score < bestScore) { bestScore = score; best = t; }
                }
                if (best && bestScore < 1225) guideText = `👉 ရှေ့မှာ ရှိနေသည်: ${best.name}`;
                else if (best) guideText = `🧭 အနီးဆုံး မြင်နိုင်သော အရာ: ${best.name} (Az ${Math.round(best.az)}° · Alt ${Math.round(best.alt)}°)`;
            }
            hudGuide.innerText = guideText;

            // Milky Way finder: always-on directional arrow to the Core
            // (azimuth 0=N, 90=E; positive dAz means turn right/clockwise)
            const mwT = arGuideTargets.find(t => t.name.indexOf('Milky Way') >= 0);
            if (mwT) {
                if (mwT.alt < 0) {
                    hudMw.innerText = "🌌 Core: မိုးကုပ်အောက်မှာ ရှိနေတယ် (မတက်သေး / နစ်သွားပြီ)";
                } else {
                    let dAz = ((mwT.az - azDeg + 540) % 360) - 180;
                    const dAlt = Math.round(mwT.alt - altDeg);
                    dAz = Math.round(dAz);
                    if (Math.abs(dAz) <= 8 && Math.abs(dAlt) <= 8) {
                        hudMw.innerText = "🎯 🌌 Core က ရှေ့တည့်တည့်မှာပဲ — တွေ့ပြီ!";
                    } else {
                        const hTxt = dAz > 8 ? `➡️ ညာဘက် ${dAz}° လှည့်ပါ` : (dAz < -8 ? `⬅️ ဘယ်ဘက် ${-dAz}° လှည့်ပါ` : "⬆️ အရပ် တည့်ပြီ");
                        const vTxt = dAlt > 5 ? `အပေါ် ${dAlt}° မော့ပါ` : (dAlt < -5 ? `အောက် ${-dAlt}° နှိမ့်ပါ` : "အမြင့် တည့်ပြီ");
                        hudMw.innerText = `🌌 Core ရှာရန်: ${hTxt} · ${vTxt} (Az ${Math.round(mwT.az)}° · Alt ${Math.round(mwT.alt)}°)`;
                    }
                }
            } else {
                hudMw.innerText = "";
            }
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#top-bar') || e.target.closest('#inspection-sheet') || e.target.closest('#ar-hud')) return;
            isPointerDown = true; prevX = e.clientX; prevY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isPointerDown || !isARActive) return;
            const dx = e.clientX - prevX; const dy = e.clientY - prevY;
            prevX = e.clientX; prevY = e.clientY;

            skyYaw += dx * 0.004;
            skyPitch += dy * 0.004;
            skyPitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, skyPitch));
        });

        window.addEventListener('pointerup', () => { isPointerDown = false; });

        function handleOrientation(e) {
            if (!isARActive) return;
            sensorLastTs = Date.now();
            if (e.webkitCompassHeading !== undefined) {
                sensorAlpha = 360 - e.webkitCompassHeading;
                sensorBeta = e.beta;
                sensorGamma = e.gamma;
            } else if (e.alpha !== null) {
                sensorAlpha = e.alpha;
                sensorBeta = e.beta;
                sensorGamma = e.gamma;
            }
        }

        function attachOrientation() {
            if (orientationAttached) return;
            orientationAttached = true;
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('deviceorientation', handleOrientation, true);
        }
        function requestOrientationPermission() {
            // iOS: this MUST be called inside the tap handler itself — after any await
            // (e.g. the camera prompt) Safari silently refuses and no sensor data ever flows.
            if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then((perm) => {
                    if (perm === 'granted') attachOrientation();
                }).catch(() => {});
            } else {
                attachOrientation();
            }
        }
        document.getElementById('hud-sensor-btn').addEventListener('click', () => { requestOrientationPermission(); });

        async function startARMode() {
            isARActive = true;
            video.style.display = 'block';
            arHud.style.display = 'flex';
            renderer.setClearColor(0x000000, 0); // Transparent canvas to see camera

            solarGroup.visible = false;
            constellationGroup.visible = false;
            arSkyGroup.visible = true;

            controls.enabled = false;
            camera.position.set(0, 0, 0);
            skyYaw = 0; skyPitch = 0;
            buildRealARSky();

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                console.warn("Camera could not be opened:", err);
            }

            attachOrientation();
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    userLat = pos.coords.latitude; userLon = pos.coords.longitude;
                    if (isARActive) buildRealARSky();
                }, () => {}, { timeout: 8000 });
            }
        }

        function stopARMode() {
            isARActive = false;
            video.style.display = 'none';
            arHud.style.display = 'none';
            renderer.setClearColor(0x010206, 1);
            arSkyGroup.visible = false;

            window.removeEventListener('deviceorientationabsolute', handleOrientation);
            window.removeEventListener('deviceorientation', handleOrientation);
            orientationAttached = false;

            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
        }

        // ၈။ SPLIT-VIEW INSPECTION & PERFECT SCREEN-FITTING
        let currentMode = 'SOLAR', currentTarget = null;
        const inspectionSheet = document.getElementById('inspection-sheet');

        function restoreOverview() {
            if (currentTarget && currentTarget.label) currentTarget.label.visible = true;
            currentTarget = null;
            followTarget = null;
            if (audioOn) setBodyTone('Sun');
            inspectionSheet.style.display = 'none';
            controls.enabled = true;

            if (currentMode === 'SOLAR') {
                new TWEEN.Tween(camera.position).to(OVERVIEW_CAM, 1200).easing(TWEEN.Easing.Cubic.InOut).start();
                new TWEEN.Tween(controls.target).to(OVERVIEW_TARGET, 1200).easing(TWEEN.Easing.Cubic.InOut).start();
            } else if (currentMode === 'CONSTELLATION') {
                // CELESTIAL GLOBE OVERVIEW (User can freely orbit & zoom the entire sky!)
                new TWEEN.Tween(camera.position).to(new THREE.Vector3(0, 1000, 2400), 1200).easing(TWEEN.Easing.Cubic.InOut).start();
                new TWEEN.Tween(controls.target).to(new THREE.Vector3(0, 0, 0), 1200).easing(TWEEN.Easing.Cubic.InOut).start();
            }
        }

        function showStoryDirect(data, bg = '#38bdf8') {
            document.getElementById('sheet-preview').style.background = bg;
            document.getElementById('sheet-title-text').innerText = data.name + (data.myan ? ` (${data.myan})` : '');
            document.getElementById('sheet-subtitle').innerText = data.period ? `Orbital Period: ${data.period}` : "Constellation (ကြယ်စင်စု)";
            document.getElementById('sheet-discovery').innerHTML = data.discovery || "-";
            document.getElementById('sheet-missions').innerHTML = data.missions || "-";
            document.getElementById('sheet-myth').innerHTML = data.myth || "-";
            inspectionSheet.classList.remove('sheet-collapsed');
            document.getElementById('sheet-toggle').innerHTML = '&#9662;';
            inspectionSheet.style.display = 'flex';
        }

        function inspectBody(bodyObj) {
            currentTarget = bodyObj;
            if (bodyObj.label) bodyObj.label.visible = false;

            const targetPos = bodyObj.mesh.position;
            const radius = bodyObj.data.radius || 2;
            const camDist = Math.max(radius * 4.2, (bodyObj.data.viewSize || 0) * 2.6, 7.5);

            controls.enabled = false;
            new TWEEN.Tween(camera.position)
                .to(targetPos.clone().add(new THREE.Vector3(camDist, camDist * 0.5, camDist)), 1200)
                .easing(TWEEN.Easing.Cubic.InOut).start();
            new TWEEN.Tween(controls.target)
                .to(targetPos.clone().add(new THREE.Vector3(0, -radius * 0.35, 0)), 1200)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onComplete(() => {
                    controls.enabled = true;
                    const bpSnap = bodyObj.mesh.position;
                    const snapDir = camera.position.clone().sub(bpSnap);
                    if (snapDir.lengthSq() < 0.001) snapDir.set(1, 0.45, 1);
                    snapDir.normalize();
                    controls.target.copy(bpSnap);
                    camera.position.copy(bpSnap).addScaledVector(snapDir, camDist * 1.5);
                    followTarget = bodyObj;
                    followLastPos.copy(bodyObj.mesh.position);
                    if (audioOn) setBodyTone(bodyObj.data.name);
                    showStoryDirect(bodyObj.data);
                }).start();
        }

        // PERFECT CONSTELLATION FITTING ON SCREEN
        function fitConstellationToScreen(constObj) {
            const center = constObj.centerVec;
            const radius = constObj.sphereRadius || 250;

            // Compute distance so constellation occupies ~65% of screen
            const fovRad = THREE.MathUtils.degToRad(camera.fov);
            const fitDist = (radius / Math.tan(fovRad / 2)) * 1.35;
            const camPos = center.clone().normalize().multiplyScalar(center.length() + fitDist);

            controls.enabled = false;
            new TWEEN.Tween(camera.position).to(camPos, 1300).easing(TWEEN.Easing.Cubic.InOut).start();
            new TWEEN.Tween(controls.target).to(center, 1300).easing(TWEEN.Easing.Cubic.InOut).onComplete(() => {
                controls.enabled = true;
                showStoryDirect(constObj.data, "radial-gradient(circle, #38bdf8, #1e3a8a)");
            }).start();
        }

        // Raycasting Click-to-Inspect in all modes
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#top-bar') || e.target.closest('#inspection-sheet') || e.target.closest('#ar-hud')) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (currentMode === 'AR') {
                const hits = raycaster.intersectObjects(arInteractiveMeshes, true);
                if (hits.length > 0) {
                    const item = hits[0].object.userData;
                    if (item && item.data) showStoryDirect(item.data);
                }
            } else if (currentMode === 'CONSTELLATION') {
                const hits = raycaster.intersectObjects(constInteractiveMeshes, true);
                if (hits.length > 0) {
                    const item = hits[0].object.userData;
                    if (item && item.data) {
                        const found = constellationsList.find(c => c.data.name === item.data.name);
                        if (found) fitConstellationToScreen(found);
                    }
                }
            } else if (currentMode === 'SOLAR') {
                const hits = raycaster.intersectObjects(interactiveMeshes, true);
                if (hits.length > 0) {
                    let obj = hits[0].object;
                    while (obj && !obj.userData.bodyObj && obj.parent) obj = obj.parent;
                    if (obj && obj.userData.bodyObj) {
                        inspectBody(obj.userData.bodyObj);
                        document.getElementById('target-selector').value = obj.userData.name;
                    }
                }
            }
        });

        // ၉။ MODE SWITCHING LOGIC
        const btnSolar = document.getElementById('btn-mode-solar');
        const btnConst = document.getElementById('btn-mode-const');
        const btnAR = document.getElementById('btn-mode-ar');

        btnSolar.addEventListener('click', () => {
            if (currentMode === 'SOLAR') return;
            if (currentMode === 'AR') stopARMode();
            currentMode = 'SOLAR';

            btnSolar.classList.add('active'); btnConst.classList.remove('active'); btnAR.classList.remove('active');
            solarGroup.visible = true; constellationGroup.visible = false; arSkyGroup.visible = false;

            planetsOpt.style.display = 'block'; asteroidsOpt.style.display = 'block';
            constOptionGroup.style.display = 'none';
            document.getElementById('target-selector').value = "Overview";

            restoreOverview();
        });

        btnConst.addEventListener('click', () => {
            if (currentMode === 'CONSTELLATION') return;
            if (currentMode === 'AR') stopARMode();
            currentMode = 'CONSTELLATION';

            btnConst.classList.add('active'); btnSolar.classList.remove('active'); btnAR.classList.remove('active');
            solarGroup.visible = false; constellationGroup.visible = true; arSkyGroup.visible = false;

            // Show Constellations in Dropdown & Switch to Globe Overview!
            planetsOpt.style.display = 'none'; asteroidsOpt.style.display = 'none';
            constOptionGroup.style.display = 'block';
            document.getElementById('target-selector').value = "Overview";

            restoreOverview();
        });

        btnAR.addEventListener('click', () => {
            if (currentMode === 'AR') return;
            currentMode = 'AR';

            btnAR.classList.add('active'); btnSolar.classList.remove('active'); btnConst.classList.remove('active');
            planetsOpt.style.display = 'none'; asteroidsOpt.style.display = 'none';
            constOptionGroup.style.display = 'block';

            requestOrientationPermission();
            startARMode();
        });

        // Dropdown selection
        document.getElementById('target-selector').addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === "Overview") {
                restoreOverview();
            } else if (val.startsWith("CONST_")) {
                const cName = val.replace("CONST_", "");
                const found = constellationsList.find(c => c.data.name === cName);
                if (found) fitConstellationToScreen(found);
            } else {
                const found = trackedBodies.find(b => b.data.name === val);
                if (found) inspectBody(found);
            }
        });

        document.getElementById('sheet-close').addEventListener('click', () => {
            restoreOverview();
            document.getElementById('target-selector').value = "Overview";
        });
        document.getElementById('sheet-toggle').addEventListener('click', () => {
            const collapsed = inspectionSheet.classList.toggle('sheet-collapsed');
            document.getElementById('sheet-toggle').innerHTML = collapsed ? '&#9652;' : '&#9662;';
        });
        document.getElementById('reset-cam-btn').addEventListener('click', () => {
            document.getElementById('target-selector').value = "Overview";
            restoreOverview();
        });

        // ၁၀။ ANIMATION LOOP
        const baseSpeed = 0.02;
        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();

            if (currentMode === 'SOLAR') {
                sunMesh.rotation.y += 0.002;
                beltMesh.rotation.y += 0.0003; // Rotate the 3,500 asteroids!
                // REAL POSITIONS: advance simulation time, then place every body by Kepler
                const frameNow = performance.now();
                const dtSec = Math.min(0.1, (frameNow - lastFrameMs) / 1000);
                lastFrameMs = frameNow;
                if (simPlaying) { simJD += dtSec * simSpeedDays; syncSimUI(); }
                craftClock += dtSec;
                let earthObj = null;
                trackedBodies.forEach(obj => { if (obj.data.name === 'Earth') earthObj = obj; });
                trackedBodies.forEach(obj => {
                    const { mesh, data } = obj;
                    if (obj.kind === 'moon') {
                        if (earthObj) {
                            const mp = moonPosition(simJD);
                            const mv = new THREE.Vector3(mp.x, mp.z, -mp.y);
                            const len = mv.length() || 1;
                            mesh.position.copy(earthObj.mesh.position).add(mv.multiplyScalar(MOON_DISPLAY_DIST / len));
                        }
                    } else if (obj.kind === 'comet') {
                        const hp = halleyPosition(simJD);
                        mesh.position.copy(auToScene(hp));
                        const rAU = Math.sqrt(hp.x * hp.x + hp.y * hp.y + hp.z * hp.z) || 1;
                        const tailLen = Math.max(3, Math.min(34, 30 / (rAU * rAU)));
                        const away = mesh.position.clone().normalize();
                        obj.tailGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), away);
                        obj.tailGroup.scale.set(1 + 6 / rAU, tailLen, 1 + 6 / rAU);
                        obj.comaSprite.material.opacity = Math.max(0.25, Math.min(0.95, 1.6 / rAU));
                    } else if (obj.kind === 'sat') {
                        if (earthObj) {
                            const th = obj.phase + craftClock * obj.speed;
                            const ci = Math.cos(obj.incl * Math.PI / 180), si = Math.sin(obj.incl * Math.PI / 180);
                            mesh.position.set(
                                earthObj.mesh.position.x + Math.cos(th) * obj.orbitR,
                                earthObj.mesh.position.y + Math.sin(th) * si * obj.orbitR,
                                earthObj.mesh.position.z + Math.sin(th) * ci * obj.orbitR
                            );
                            mesh.rotation.y = -th;
                        }
                    } else if (obj.kind === 'jwst') {
                        if (earthObj) {
                            const ep = earthObj.mesh.position;
                            const jwstR = Math.hypot(ep.x, ep.y, ep.z) || 1;
                            mesh.position.copy(ep).addScaledVector(ep, 15 / jwstR);
                            const haloA = (simJD % 168) / 168 * Math.PI * 2;
                            mesh.position.y += Math.sin(haloA) * 1.6;
                            mesh.position.x += Math.cos(haloA) * 0.9;
                            mesh.lookAt(0, 0, 0);
                        }
                    } else {
                        const p = PLANET_ELEMENTS[data.name] ? planetPosition(data.name, simJD) : smallBodyPosition(data.name, simJD);
                        if (p) {
                            mesh.position.copy(auToScene(p));
                        } else {
                            // Fallback (no elements on file): original tuned motion
                            obj.angle += (0.015 / Math.pow(data.a, 0.75)) * baseSpeed;
                            const a = getVisualDistance(data.a);
                            const b = a * Math.sqrt(Math.max(0.001, 1 - data.e * data.e));
                            mesh.position.x = a * Math.cos(obj.angle) - (a * data.e);
                            mesh.position.z = b * Math.sin(obj.angle);
                        }
                    }
                    mesh.rotation.y += 0.015;
                    if (obj.clouds) obj.clouds.rotation.y += 0.006;
                });
                // Camera follows the inspected body as it moves along its real orbit
                if (followTarget) {
                    const fp = followTarget.mesh.position;
                    const dx = fp.x - followLastPos.x, dy = fp.y - followLastPos.y, dz = fp.z - followLastPos.z;
                    if (dx || dy || dz) {
                        camera.position.x += dx; camera.position.y += dy; camera.position.z += dz;
                        controls.target.x += dx; controls.target.y += dy; controls.target.z += dz;
                        followLastPos.copy(fp);
                    }
                }
                controls.update();
            } else if (currentMode === 'CONSTELLATION') {
                controls.update(); // Smooth orbital zoom & rotation around celestial globe!
            } else if (currentMode === 'AR') {
                updateARCamera();
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
